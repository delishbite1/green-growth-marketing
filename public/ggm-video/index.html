<style>
  :root { --navy: #16264a; --gold: #c9a24a; --cream: #f7f2e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  .stage { position: relative; background: #000; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: contain; background: #000; }
  .sound {
    position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 12px;
    min-height: 60px; padding: 0 28px; border: 0; border-radius: 999px;
    background: var(--navy); color: #fff; font-family: inherit; font-size: 19px; font-weight: 700; line-height: 1;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 3px rgba(201,162,74,.9);
    cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  }
  .sound:active { transform: translateX(-50%) scale(.97); }
  .sound svg { width: 26px; height: 26px; flex: none; }
  .sound[hidden] { display: none; }
  footer { padding: 18px 16px 28px; text-align: center; font-size: 15px; line-height: 1.5; }
  footer a { color: var(--navy); font-weight: 600; }
  @media (min-width: 520px) { main { padding-top: 24px; } .stage { border-radius: 18px; overflow: hidden; } }
</style>
</head>
<body>
<main>
  <div class="stage">
    <video id="v" controls playsinline muted autoplay preload="metadata"
           poster="/ggm-video/poster.jpg" width="1080" height="1920">
      <source src="/ggm-video/ggm-promo.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="/ggm-video/ggm-promo.mp4">Download the MP4</a>.
    </video>
    <button class="sound" id="sound" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      Tap to hear the music
    </button>
  </div>
  <footer>
    Green Growth Marketing<br>
    <a href="https://greengrowthmarketinginc.com/">greengrowthmarketinginc.com</a>
  </footer>
</main>
<script>
  (function () {
    var v = document.getElementById('v');
    var b = document.getElementById('sound');
    v.muted = true;
    var p = v.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked: poster stays, controls still work */ });
    b.addEventListener('click', function () {
      v.muted = false;
      v.volume = 1;
      if (v.ended) v.currentTime = 0;
      var q = v.play();
      if (q && q.catch) q.catch(function () {});
      b.hidden = true;
    });
    // If the viewer unmutes with the player's own controls, the button is no longer needed.
    v.addEventListener('volumechange', function () { if (!v.muted && v.volume > 0) b.hidden = true; });
  })();
</script>
</body>
